<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    QC Portal app mark — a quality seal with the check cut out of it: the sign-off
    this portal exists to produce.

    Geometry is shared with <AppLogo> in web/src/App.tsx — same seal coordinates,
    same check, same weights. Change one, change the other. (Seal: centre 16,16,
    outer radius 12.7, 10 lobes, lobe depth 2.6, stroked 3.4 with a round linejoin,
    which is what rounds the scallops. A bare polygon gives hard points and reads
    as a star, not a stamp.)

    Unlike the earlier marks this one is NOT set on a rounded square. The seal has
    its own silhouette, and a shaped tab icon is far easier to pick out of a strip
    of rounded-square favicons. The check is a mask cut-out, so it shows the browser
    chrome through it rather than being painted a fixed colour.

    Colours are the app's own primary token (Tailwind slate-900), flipped to slate-200
    under prefers-color-scheme so the mark keeps its contrast on dark browser chrome.
    A browser that ignores the media query gets the light-scheme value, which reads
    on both.

    NOTE: this is an XML comment, so it must never contain a double hyphen — a CSS
    custom property name written out in full here is a parse error, and the whole
    file then renders as the browser's XML error page instead of an icon.
  -->
  <style>
    .seal { fill: #0f172a; stroke: #0f172a }
    @media (prefers-color-scheme: dark) {
      .seal { fill: #e2e8f0; stroke: #e2e8f0 }
    }
  </style>

  <mask id="qc-seal-check">
    <rect width="32" height="32" fill="#fff" />
    <path
      d="M10.4 16.4l3.9 3.9 7.5-8.6"
      stroke="#000"
      stroke-width="3.4"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </mask>

  <path
    class="seal"
    d="M16.00 3.30L19.12 6.39L23.46 5.73L24.17 10.06L28.08 12.08L26.10 16.00L28.08 19.92L24.17 21.94L23.46 26.27L19.12 25.61L16.00 28.70L12.88 25.61L8.54 26.27L7.83 21.94L3.92 19.92L5.90 16.00L3.92 12.08L7.83 10.06L8.54 5.73L12.88 6.39Z"
    stroke-width="3.4"
    stroke-linejoin="round"
    mask="url(#qc-seal-check)"
  />
</svg>
